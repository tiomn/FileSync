[package]
name = "filesync"
version = "1.0.1"
description = "文件同步助手 - 监听目录变更并同步到目标目录"
authors = ["FileSync"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
walkdir = "2"
trash = "5"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# 用于注册 AppUserModelID，使未安装（绿色版）程序也能弹出系统通知
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
